# S2S serverless worker image: build with ALL weights baked in and push to the PRIVATE Docker Hub repo
# docker.io/<DOCKERHUB_USER>/s2s-worker (DECISIONS D-BAKE, 2026-10-06).
# Repo: github.com/shivamgcodes/s2s-hinglish-agent (monorepo, D-MONOREPO 2026-10-06; was s2s-worker's build.yml).
# Build context = the repo root (worker/Dockerfile COPYs common/ and worker/); BuildKit applies
# worker/Dockerfile.dockerignore (a whitelist: client/, space/, docs/, ops/, tests/ never enter the context).
#
# Two phases, because the runner disk (72 GB, ~14 GB free, no separate /mnt) cannot hold a 16 GB BuildKit layer and
# its compressed blob at once (attempt 1: ENOSPC):
#   1. BuildKit builds + pushes everything except PersonaPlex (BAKE_PP=0): :base-<sha12>   (~24 GB disk peak)
#   2. the 4 PersonaPlex files are downloaded on the runner, sha256-checked against the HF LFS ids, and STREAMED into
#      one appended layer with crane (no local blob): :<sha12> and :latest                (~16.5 GB disk peak)
#
# Secrets (repo settings -> Secrets and variables -> Actions):
#   HF_TOKEN         HF token with read access to nvidia/personaplex-7b-v1 (gated) and shivamgupta/s2s-v4-assets.
#                    Phase 1: ONLY a BuildKit secret (id=hf_token), never a build-arg, never in a layer.
#                    Phase 2: an env var of one step, sent only to huggingface.co (curl drops it on the CDN redirect).
#   DOCKERHUB_USER   Docker Hub username
#   DOCKERHUB_TOKEN  Docker Hub personal access token (read/write)
# The run refuses to push unless <user>/s2s-worker already exists on Docker Hub AND is private (the image contains
# the gated PersonaPlex weights and the private adapter). A free Docker Hub account has 1 private repo.
name: build-worker-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "extra image tag (optional; the short commit sha and 'latest' are always pushed)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-worker-image
  cancel-in-progress: false

env:
  PP_REPO: nvidia/personaplex-7b-v1
  PP_REVISION: fdaf4090a61cb315c138a1faee287ffd6c716309   # = Dockerfile ARG PP_REVISION
  CRANE_VERSION: v0.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          docker system prune -af --volumes > /dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
                      /opt/microsoft /opt/google /usr/lib/jvm /opt/az /usr/lib/google-cloud-sdk /usr/local/share/chromium \
                      /usr/local/julia* /opt/pipx /usr/local/share/vcpkg /usr/share/miniconda /home/runner/.rustup \
                      /home/runner/.cargo /usr/local/aws-cli /usr/local/aws-sam-cli /opt/mssql-tools /usr/share/az_* \
                      2>/dev/null || true
          df -h /

      - name: Check secrets are present
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for v in HF_TOKEN DOCKERHUB_USER DOCKERHUB_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          echo "secrets present (values not shown)"

      - name: Refuse unless the Docker Hub repo exists and is PRIVATE
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          JWT=$(jq -n --arg u "$DOCKERHUB_USER" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' \
                | curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login | jq -r .token)
          echo "::add-mask::$JWT"
          PRIV=$(curl -fsS -H "Authorization: Bearer $JWT" \
                 "https://hub.docker.com/v2/repositories/$DOCKERHUB_USER/s2s-worker/" | jq -r .is_private)
          echo "docker.io/$DOCKERHUB_USER/s2s-worker is_private=$PRIV"
          [ "$PRIV" = "true" ] || { echo "::error::Docker Hub repo missing or PUBLIC: create it private first"; exit 1; }

      - uses: actions/checkout@v4

      - name: Static Dockerfile check
        run: python3 worker/tests/check_dockerfile.py --root . --dockerfile worker/Dockerfile --ignore worker/Dockerfile.dockerignore

      - name: Tags
        id: tags
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          EXTRA: ${{ github.event.inputs.tag }}
        run: |
          IMG="docker.io/$DOCKERHUB_USER/s2s-worker"
          SHA=${GITHUB_SHA::12}
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$IMG:base-$SHA" >> "$GITHUB_OUTPUT"
          X=""; [ -z "${EXTRA:-}" ] || X="$EXTRA"
          [ "${GITHUB_REF_TYPE}" != tag ] || X="$X ${GITHUB_REF_NAME}"
          echo "extra=$X" >> "$GITHUB_OUTPUT"
          echo "base $IMG:base-$SHA -> final $IMG:$SHA, latest $X"

      - name: Root .dockerignore for this build (= worker/Dockerfile.dockerignore; belt and braces, BuildKit also reads it next to the Dockerfile)
        run: cp worker/Dockerfile.dockerignore .dockerignore

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Phase 1: build + push the base (everything but PersonaPlex; HF token as a BuildKit secret)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            BAKE_PP=0
          tags: ${{ steps.tags.outputs.base }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Free the BuildKit state
        run: |
          df -h /
          docker buildx ls
          docker buildx rm --all-inactive --force 2>/dev/null || true
          for b in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep -v '^default$' | sort -u); do
            docker buildx rm --force "$b" 2>/dev/null || true; done
          docker system prune -af --volumes > /dev/null || true
          df -h /

      - name: "Phase 2: download PersonaPlex (4 files) + sha256 check"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          D="$RUNNER_TEMP/pp"; mkdir -p "$D/opt/pp"
          # file  sha256 (= the HF LFS oid, as in the pod1 HF cache blob names)  size
          cat > "$RUNNER_TEMP/pp.sha256" <<'EOF'
          db1290db583cdaa6cb4de444ed279e0b586ca2a372b41434b07a7461c8c0e2f4  model.safetensors
          09b782f0629851a271227fb9d36db65c041790365f11bbe5d3d59369cf863f50  tokenizer-e351c8d8-checkpoint125.safetensors
          78d4336533ddc26f9acf7250d7fb83492152196c6ea4212c841df76933f18d2d  tokenizer_spm_32k_3.model
          8564e9ca7a06ca723b07c3a77c623f0faa5937d04b2647b3a727b06c5ca0b7bb  voices.tgz
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/pp.sha256"
          for f in $(awk '{print $2}' "$RUNNER_TEMP/pp.sha256"); do
            t0=$(date +%s)
            curl -fsSL --retry 5 --retry-delay 10 -H "Authorization: Bearer $HF_TOKEN" \
                 -o "$D/opt/pp/$f" "https://huggingface.co/$PP_REPO/resolve/$PP_REVISION/$f"
            echo "$f $(stat -c %s "$D/opt/pp/$f") bytes in $(( $(date +%s) - t0 )) s"
          done
          (cd "$D/opt/pp" && sha256sum -c "$RUNNER_TEMP/pp.sha256")
          tar -xzf "$D/opt/pp/voices.tgz" -C "$D/opt/pp"
          test -f "$D/opt/pp/voices/NATF2.pt"
          chmod -R u=rwX,go=rX "$D/opt"
          ls -la "$D/opt/pp"; du -sh "$D/opt/pp"; df -h /

      - name: "Phase 3: append /opt/pp as one streamed layer (crane) and tag"
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMG: ${{ steps.tags.outputs.img }}
          SHA: ${{ steps.tags.outputs.sha }}
          BASE: ${{ steps.tags.outputs.base }}
          EXTRA: ${{ steps.tags.outputs.extra }}
        run: |
          set -eu
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" crane
          C="$RUNNER_TEMP/crane"; $C version
          printf '%s' "$DOCKERHUB_TOKEN" | $C auth login index.docker.io -u "$DOCKERHUB_USER" --password-stdin
          t0=$(date +%s)
          # reproducible layer (2026-10-06): same 4 files -> byte-identical tar -> same layer digest, so a later rebuild
          # can skip re-pushing ~16 GB when the registry already has the blob
          tar -C "$RUNNER_TEMP/pp" --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=posix \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime -cf - opt/pp \
            | $C append -f - -b "$BASE" -t "$IMG:$SHA"
          echo "append + push: $(( $(date +%s) - t0 )) s"
          $C tag "$IMG:$SHA" latest
          for t in $EXTRA; do $C tag "$IMG:$SHA" "$t"; done
          rm -rf "$RUNNER_TEMP/pp"

      - name: Verify + image size
        env:
          IMG: ${{ steps.tags.outputs.img }}
          SHA: ${{ steps.tags.outputs.sha }}
          BASE: ${{ steps.tags.outputs.base }}
        run: |
          set -eu
          C="$RUNNER_TEMP/crane"
          $C config "$IMG:$SHA" > cfg.json; $C config "$BASE" > base_cfg.json
          jq -r '.config.Env[]' cfg.json | grep -E '^(S2S_PP_DIR|S2S_ASSETS|HF_HUB_OFFLINE)='
          nb=$(jq '.rootfs.diff_ids|length' base_cfg.json); nf=$(jq '.rootfs.diff_ids|length' cfg.json)
          echo "diff_ids: base $nb, final $nf"; [ "$nf" = $((nb + 1)) ]
          $C manifest "$IMG:$SHA" > manifest.json
          jq -r '"layers: \(.layers|length)  compressed total: \((([.layers[].size]|add)/1e9*100|floor)/100) GB  (largest layer \((([.layers[].size]|max)/1e9*100|floor)/100) GB)"' manifest.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image: $IMG:$SHA (also :latest; digest $($C digest "$IMG:$SHA"))" | tee -a "$GITHUB_STEP_SUMMARY"
